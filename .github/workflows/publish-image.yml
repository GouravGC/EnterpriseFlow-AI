
name: Build and Publish EnterpriseFlow AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gouravgc/enterpriseflow-ai

jobs:
  publish:
    name: Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/gouravgc/enterpriseflow-ai:latest
            ghcr.io/gouravgc/enterpriseflow-ai:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GouravGC/EnterpriseFlow-AI
            org.opencontainers.image.description=EnterpriseFlow AI enterprise operations copilot
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Trigger Render deployment
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing GitHub Actions secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Deployment pipeline summary
        if: success()
        run: |
          echo "Docker image published successfully."
          echo "Image: ghcr.io/gouravgc/enterpriseflow-ai:latest"
          echo "Render deployment hook triggered successfully."

