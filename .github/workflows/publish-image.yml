
name: Build and Publish EnterpriseFlow AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gouravgc/enterpriseflow-ai

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/gouravgc/enterpriseflow-ai:latest
            ghcr.io/gouravgc/enterpriseflow-ai:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GouravGC/EnterpriseFlow-AI
            org.opencontainers.image.description=EnterpriseFlow AI enterprise operations copilot
